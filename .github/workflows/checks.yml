name: Playground checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-input-data:
    name: Native input data (provisional)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify the runner's existing data tools
        run: |
          python3 --version
          gh --version
      - name: Run the standard-library data controls
        run: python3 -B -m unittest discover -s scripts/native_inputs -t scripts -p '*_test.py' -v
      - name: Observe the fixed provisional producer artifact as data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/probe_native_input.py > "$RUNNER_TEMP/native-input-data-summary.json"
      - name: Retain only the small data observation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-input-data-observation
          path: ${{ runner.temp }}/native-input-data-summary.json
          if-no-files-found: warn
          retention-days: 3
          overwrite: true

  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-playground
    steps:
      - uses: actions/checkout@v4
        with:
          path: agent-playground
      # Raw examples and their mock-provider helper remain the library's source
      # of truth. Runtime modules below are the exact published packages.
      - uses: actions/checkout@v4
        with:
          repository: footprintjs/agentfootprint
          ref: v10.1.0
          path: agentfootprint
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-playground/package-lock.json
      - name: Match the verified strict dependency resolver
        run: npm install --global npm@11.19.0
      - name: Prepare reviewed published dependencies in this disposable checkout
        run: |
          node scripts/prepare-ci-dependencies.mjs
          # npm install can retain a same-version local link. Refresh only the
          # reviewed names so the lock records the actual published boundary.
          npm update --package-lock-only agentfootprint agentfootprint-lens footprint-explainable-ui footprintjs
      - run: npm ci
      - run: npm ls agentfootprint agentfootprint-lens footprintjs foottrace --all
      # The sibling example helper imports its own source, whose package imports
      # must resolve to the same installed packages as the playground.
      - run: ln -s agent-playground/node_modules ../node_modules
      - run: npm test
      - run: npm run test:types
      - run: npm run lint
      - run: npm run build
